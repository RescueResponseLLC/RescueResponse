<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kit Status | RescueRadius</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:site_name" content="RescueRadius">
<meta property="og:title" content="Kit Status | RescueRadius">
<meta property="og:description" content="">
<meta property="og:image" content="https://rescueradius.com/icon-512.png">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>

<div class="topo"></div>

<nav>
  <div class="wrap" style="padding:16px 24px; display:flex; align-items:center; justify-content:space-between;">
    <a href="index.html" class="brand">
      <svg class="mark" viewBox="0 0 30 30" aria-hidden="true">
        <circle class="outer" cx="15" cy="15" r="14"/>
        <circle cx="15" cy="15" r="9.5"/>
        <rect class="cross-v" x="12.8" y="8" width="4.4" height="14" rx="1"/>
        <rect class="cross-h" x="8" y="12.8" width="14" height="4.4" rx="1"/>
      </svg>
      <span class="wordmark">Rescue<span class="accent-word">Radius</span></span>
    </a>
    <a href="index.html" class="cta-small">Back to Site</a>
  </div>
</nav>

<header class="page-hero">
  <div class="wrap">
    <div class="eyebrow">Kit Status</div>
    <h1>Check your equipment's status</h1>
    <p>Enter a kit's ID to see whether it's active and when it was last serviced. No login needed.</p>
  </div>
</header>

<section>
  <div class="wrap">
    <div style="max-width:420px; display:flex; gap:10px; margin-bottom:14px;">
      <input id="status-kit-id" placeholder="e.g. STB-4821" style="flex:1;">
      <button class="btn btn-primary" onclick="checkStatus()">Check</button>
    </div>
    <button class="btn btn-ghost" style="margin-bottom:32px;" onclick="openScanner()">📷 Scan QR Instead</button>

    <div id="status-result"></div>
  </div>
</section>

<div class="modal-overlay" id="scanner-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:100; align-items:center; justify-content:center; padding:20px;">
  <div style="background:var(--bg-card); border:1px solid var(--line); border-radius:6px; padding:24px; max-width:400px; width:100%;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
      <h3 style="font-size:16px; font-weight:700;">Scan Kit QR Code</h3>
      <button onclick="closeScanner()" style="background:none; border:none; color:var(--text-dim); font-size:20px; cursor:pointer;">✕</button>
    </div>
    <div id="qr-reader" style="width:100%; min-height:280px; background:#000; border-radius:4px; overflow:hidden;"></div>
  </div>
</div>

<footer>
  <div class="footer-inner">
    <p>
      RESCUERADIUS LLC · IDAHO-OWNED
      <svg class="flag" viewBox="0 0 30 20" aria-label="United States flag">
        <rect width="30" height="20" fill="#F2EFE9"/>
        <rect y="0" width="30" height="1.54" fill="#E8622E"/>
        <rect y="3.08" width="30" height="1.54" fill="#E8622E"/>
        <rect y="6.16" width="30" height="1.54" fill="#E8622E"/>
        <rect y="9.24" width="30" height="1.54" fill="#E8622E"/>
        <rect y="12.32" width="30" height="1.54" fill="#E8622E"/>
        <rect y="15.4" width="30" height="1.54" fill="#E8622E"/>
        <rect y="18.48" width="30" height="1.54" fill="#E8622E"/>
        <rect width="12" height="10.8" fill="#7C9885"/>
      </svg>
      · &copy; 2026
    </p>
    <p>(208) 918-3185 · RescueRadius@outlook.com</p>
  </div>
</footer>

<script>
  const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbz8Wc4Kb736qB8ykJfMM3H4iiWd0q4kSQtjGbOQvG1-5wR-MSRA-rOVTgthWzzjFucQbA/exec';

  const params = new URLSearchParams(window.location.search);
  const kitParam = params.get('kit');
  if (kitParam) {
    document.getElementById('status-kit-id').value = kitParam;
    checkStatus();
  }

  function checkStatus(){
    const code = document.getElementById('status-kit-id').value.trim();
    const resultBox = document.getElementById('status-result');
    if(!code){ return; }
    resultBox.innerHTML = '<p class="sub" style="color:var(--text-dim);">Checking...</p>';

    const cb = 'rrStatus_' + Date.now();
    const timeout = setTimeout(() => { cleanup(); showError(); }, 8000);
    function cleanup(){ delete window[cb]; const t=document.getElementById(cb); if(t) t.remove(); clearTimeout(timeout); }

    function showError(){
      resultBox.innerHTML = '<div class="note-banner"><p>Could not reach the status service right now. Try again in a moment, or contact us directly.</p></div>';
    }

    window[cb] = function(data){
      cleanup();
      if(!data || !data.found){
        resultBox.innerHTML = '<div class="note-banner"><p>No kit found with that ID. Double-check the code and try again, or contact us if you think this is a mistake.</p></div>';
        return;
      }
      resultBox.innerHTML = `
        <div class="note-banner">
          <h3>${data.code} (${data.type})</h3>
          <p><strong style="color:var(--text);">Status:</strong> ${data.statusLabel}</p>
          <p><strong style="color:var(--text);">Last serviced:</strong> ${data.lastServiceDate || 'No service recorded yet'}</p>
        </div>
      `;
    };

    const script = document.createElement('script');
    script.id = cb;
    script.src = BACKEND_URL + '?action=status&code=' + encodeURIComponent(code) + '&callback=' + cb;
    script.onerror = function(){ cleanup(); showError(); };
    document.body.appendChild(script);
  }

  document.getElementById('status-kit-id').addEventListener('keydown', function(e){
    if(e.key === 'Enter') checkStatus();
  });

  let html5QrScanner = null;
  function openScanner(){
    document.getElementById('scanner-modal').style.display = 'flex';
    html5QrScanner = new Html5Qrcode('qr-reader');
    setTimeout(() => {
    html5QrScanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: 220 },
      (decodedText) => {
        let code = decodedText;
        try{
          const url = new URL(decodedText);
          const kitParam = url.searchParams.get('kit');
          if(kitParam) code = kitParam;
        }catch(e){}
        document.getElementById('status-kit-id').value = code;
        closeScanner();
        checkStatus();
      },
      () => {}
    ).catch(() => { alert('Could not start camera. Check permissions and try again.'); });
    }, 150);
  }
  function closeScanner(){
    document.getElementById('scanner-modal').style.display = 'none';
    if(html5QrScanner){
      html5QrScanner.stop().then(() => html5QrScanner.clear()).catch(() => {});
      html5QrScanner = null;
    }
  }
</script>
</body>
</html>
